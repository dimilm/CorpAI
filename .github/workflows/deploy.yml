name: Deploy

# Manual button only: GitHub -> Actions -> Deploy -> "Run workflow".
# SSHes into the prod server and runs scripts/deploy.sh there (build-on-server).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_REF
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            DEPLOY_REF="${DEPLOY_REF:-main}" bash scripts/deploy.sh
